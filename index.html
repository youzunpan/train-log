<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訓練記錄">
<meta name="theme-color" content="#0e1013">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>訓練記錄</title>
<style>
:root{
  --bg:#0e1013; --card:#181c22; --card2:#1f242c; --line:#2a3038;
  --fg:#e8eaed; --dim:#8a919b; --accent:#4ade80; --accent-dim:#173325;
  --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;
  font-size:16px;overscroll-behavior-y:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.num{font-variant-numeric:tabular-nums}

/* ── 頂部分頁 ── */
#tabs{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;
  background:rgba(14,16,19,.92);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top)}
#tabs button{flex:1;min-height:48px;background:none;border:none;color:var(--dim);
  font-size:16px;font-weight:600;border-bottom:2.5px solid transparent}
#tabs button.on{color:var(--fg);border-bottom-color:var(--accent)}

main{display:none;padding:calc(58px + env(safe-area-inset-top)) 12px calc(96px + env(safe-area-inset-bottom))}
main.on{display:block}

/* ── 動作選擇 ── */
#exGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#exGrid button{min-height:48px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;color:var(--fg);font-size:15px;font-weight:500;padding:4px 2px}
#exGrid button.sel{background:var(--accent-dim);border-color:var(--accent);color:var(--accent);font-weight:700}
#customRow{display:flex;gap:8px;margin-top:8px}
#customRow input{flex:1;min-height:48px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;color:var(--fg);font-size:16px;padding:0 12px;-webkit-user-select:text;user-select:text}
#customRow button{min-width:72px;min-height:48px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;color:var(--fg);font-size:15px;font-weight:600}

/* ── 上次成績 ── */
#lastBox{margin-top:12px;padding:12px 14px;background:var(--card);border-radius:12px;
  border:1px solid var(--line);font-size:15px;color:var(--dim);line-height:1.5;display:none}
#lastBox.show{display:block}
#lastBox .beat{color:var(--accent);font-weight:700}
#lastBox .pr{color:var(--amber);font-weight:700}

/* ── 備份提醒 ── */
#backupWarn{display:none;margin-bottom:10px;padding:12px 14px;border-radius:12px;
  background:#3a2a10;border:1px solid var(--amber);color:var(--amber);
  font-size:14px;font-weight:600;line-height:1.5;width:100%;text-align:left}
#backupWarn.show{display:block}
#backupInfo{margin-top:8px;font-size:13px;color:var(--dim);text-align:center}

/* ── 日期選擇 ── */
#dateRow{display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:8px 14px;margin-bottom:10px;font-size:14px;color:var(--dim)}
#dateRow input{background:none;border:none;color:var(--fg);font-size:17px;font-weight:700;
  -webkit-appearance:none;appearance:none;outline:none;color-scheme:dark;
  font-variant-numeric:tabular-nums;min-height:36px}
#dateRow.past{border-color:var(--amber)}
#dateRow.past span{color:var(--amber)}

/* ── 數字輸入區 ── */
.numrow{margin-top:12px;display:flex;gap:10px}
.numrow label{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 8px 6px;font-size:12px;color:var(--dim)}
.numrow input{width:100%;background:none;border:none;color:var(--fg);
  font-size:34px;font-weight:800;text-align:center;outline:none;
  -webkit-user-select:text;user-select:text;font-variant-numeric:tabular-nums}
.numrow label:focus-within{border-color:var(--accent)}

#addBtn{margin-top:12px;width:100%;min-height:64px;border:none;border-radius:16px;
  background:var(--accent);color:#08210f;font-size:20px;font-weight:800}
#addBtn:disabled{background:var(--card2);color:var(--dim)}
#addBtn:active:not(:disabled){filter:brightness(1.15)}

#undoRow{display:flex;gap:8px;margin-top:10px}
#undoRow button{flex:1;min-height:48px;background:none;border:1px solid var(--line);
  border-radius:12px;color:var(--dim);font-size:15px;font-weight:600}
#undoRow #undoBtn{color:var(--red);border-color:#4a2a2a}

/* ── 今日清單 ── */
#todayList{margin-top:18px}
#todayList h3{font-size:13px;color:var(--dim);font-weight:600;margin-bottom:8px;letter-spacing:.05em}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px}
.blk .hd{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:16px}
.blk .hd .vol{font-size:13px;color:var(--dim);font-weight:500}
.blk .hd .prtag{color:var(--amber);font-size:12px;font-weight:800;margin-left:6px}
.blk .rows{margin-top:2px}
.setrow{display:flex;align-items:center;justify-content:space-between;
  color:var(--dim);font-size:15px;min-height:40px}
.setrow b{color:var(--fg);font-weight:600}
.setrow .del{background:none;border:none;color:var(--red);font-size:17px;
  min-width:44px;min-height:40px;text-align:right;padding-right:2px}

/* ── 底部固定列 ── */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(20,24,29,.95);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;align-items:baseline;justify-content:space-between;gap:12px}
#foot .stats{font-size:14px;color:var(--dim)}
#foot .stats b{color:var(--fg);font-size:22px;font-weight:800;margin:0 2px}
#foot .sub{font-size:14px;color:var(--dim)}

/* ── 匯出頁 ── */
#exportText{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  color:var(--fg);font-size:14px;line-height:1.8;padding:14px;white-space:pre-wrap;
  font-family:ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text}
.bigbtn{margin-top:12px;width:100%;min-height:56px;border:none;border-radius:14px;
  background:var(--blue);color:#071626;font-size:18px;font-weight:800}
.subbtns{display:flex;gap:8px;margin-top:10px}
.subbtns button,.subbtns label{flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;
  background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--dim);
  font-size:14px;font-weight:600}
.subbtns input{display:none}

#howto{margin-top:14px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:12px 14px;font-size:14px;color:var(--dim);line-height:1.7}
#howto summary{color:var(--fg);font-weight:700;font-size:15px;cursor:pointer;min-height:32px}
#howto div{margin-top:8px}
#howto ol{margin:8px 0 0 20px}
#howto li{margin-bottom:5px}
#howto b{color:var(--accent)}

/* ── 歷史頁 ── */
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.day .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.day .hd .d{font-weight:800;font-size:16px}
.day .hd .v{color:var(--accent);font-weight:700;font-size:14px}
.day .ln{font-size:14px;color:var(--dim);line-height:1.8}
.day .ln b{color:var(--fg);font-weight:600}
.empty{color:var(--dim);text-align:center;padding:40px 0;font-size:15px}
#toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--accent);color:#08210f;font-weight:700;padding:10px 20px;border-radius:99px;
  font-size:15px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#toast.show{opacity:1}
</style>
</head>
<body>

<nav id="tabs">
  <button class="on" data-page="log">記錄</button>
  <button data-page="export">匯出</button>
  <button data-page="history">歷史</button>
</nav>

<main id="page-log" class="on">
  <button id="backupWarn"></button>
  <div id="dateRow"><span id="dateLabel">記錄日期</span><input id="dateIn" type="date"></div>
  <div id="exGrid"></div>
  <div id="customRow">
    <input id="customInput" type="text" placeholder="自訂動作…" enterkeyhint="done">
    <button id="customAdd">新增</button>
  </div>

  <div id="lastBox"></div>

  <div class="numrow">
    <label>公斤<input id="wIn" type="text" inputmode="decimal" value="50" enterkeyhint="done"></label>
    <label>次數<input id="rIn" type="text" inputmode="numeric" value="10" enterkeyhint="done"></label>
  </div>

  <button id="addBtn" disabled>加入這一組</button>
  <div id="undoRow">
    <button id="undoBtn">復原上一組</button>
  </div>

  <div id="todayList"></div>
</main>

<main id="page-export">
  <div id="exportText" class="num"></div>
  <button id="copyBtn" class="bigbtn">一鍵複製</button>
  <button id="backupBtn" class="bigbtn" style="background:var(--accent);color:#08210f">備份全部記錄</button>
  <div id="backupInfo"></div>
  <div class="subbtns">
    <button id="jsonExport">下載 JSON 檔</button>
    <label>還原備份<input id="jsonImport" type="file" accept=".json,application/json"></label>
  </div>
  <div class="subbtns">
    <button id="clearDay" style="color:var(--red)">清除今日記錄</button>
  </div>
  <details id="howto">
    <summary>組間休息計時（備忘）</summary>
    <div>
      組間休息不由本 App 負責，改用 iPhone 系統計時器，才不會中斷音樂、也能在背景提醒。
      換手機時重新設定一次即可：
      <ol>
        <li>「捷徑」App → <b>＋</b> → 動作「<b>開始計時器</b>」→ <b>90 秒</b> → 命名 <b>休息90</b></li>
        <li>「設定」→ <b>輔助使用</b> → <b>觸控</b> → <b>背面輕點</b> → <b>輕點兩下</b> → 選 <b>休息90</b></li>
      </ol>
      記錄完一組後輕點手機背面兩下即可開始倒數，畫面不會離開本 App。
    </div>
  </details>
</main>

<main id="page-history"><div id="histList"></div></main>

<footer id="foot">
  <div class="stats num" id="footStats"></div>
  <div class="sub num" id="footSub"></div>
</footer>

<div id="toast"></div>

<script>
'use strict';
const KEY='trainlog-v1', CKEY='trainlog-custom-v1';
const DEFAULT_EX=['背下拉','划船','後三角背','滑輪下拉','胸推','夾胸','肩推','側平舉',
  '腿推','股四頭','股二頭','小腿','臀內收','臀外展','臀推','二頭彎舉','三頭下壓','核心'];
const $=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('en-US');

/* ── 資料 ── */
function seed(){
  const S=(ex,segs)=>segs.flatMap(([w,reps])=>reps.map(r=>({ex,w,r})));
  return {
    '2026-08-14':[
      ...S('背下拉',[[98,[5,5,5]]]),
      ...S('划船',[[88,[9]],[79,[9,9]]]),
      ...S('臀內收',[[73,[10,9,9]]]),
      ...S('臀外展',[[68,[8,8,7]]]),
      ...S('股四頭',[[68,[10]],[77,[9,8]]]),
      ...S('股二頭',[[68,[7,7,6]]]),
      ...S('夾胸',[[73,[9,8,7]]]),
    ],
    '2026-08-17':[
      ...S('背下拉',[[88,[9,9,7]]]),
      ...S('腿推',[[136,[12,12,12,12]]]),
      ...S('臀內收',[[73,[12,11,9]]]),
      ...S('臀外展',[[68,[10,9,7]]]),
      ...S('夾胸',[[73,[10,8,7]]]),
      ...S('後三角背',[[59,[9,8,7]]]),
      ...S('胸推',[[88,[12,12]],[98,[12]]]),
    ],
  };
}
let db;
try{ db=JSON.parse(localStorage.getItem(KEY)); }catch(e){ db=null; }
if(!db||typeof db!=='object'||Array.isArray(db)){ db=seed(); persist(); }
let customEx;
try{ customEx=JSON.parse(localStorage.getItem(CKEY))||[]; }catch(e){ customEx=[]; }
function persist(){ localStorage.setItem(KEY,JSON.stringify(db)); }

function todayStr(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
let curDate=todayStr();               // 目前記錄的日期(可用日期選擇器切換)
const daySets=()=>db[curDate]||[];

/* ── 統計工具 ── */
const vol=sets=>sets.reduce((s,x)=>s+x.w*x.r,0);
const exSets=(sets,ex)=>sets.filter(s=>s.ex===ex);

// 依「連續同重量」切段：[{w, reps:[...]}]
function weightSegs(sets){
  const segs=[];
  for(const s of sets){
    const last=segs[segs.length-1];
    if(last&&last.w===s.w) last.reps.push(s.r);
    else segs.push({w:s.w,reps:[s.r]});
  }
  return segs;
}
const segText=segs=>segs.map(g=>g.w+' '+g.reps.join('/')).join('，');
const segTextKg=segs=>segs.map(g=>g.w+'kg '+g.reps.join('/')).join('，');

// 上一次做某動作（選定日期之前）：{date, sets} 或 null
function lastSession(ex){
  const dates=Object.keys(db).filter(d=>d<curDate).sort().reverse();
  for(const d of dates){
    const s=exSets(db[d],ex);
    if(s.length) return {date:d,sets:s};
  }
  return null;
}
// 某動作在選定日期之前的最大單組重量（PR 判定用）
function histMaxW(ex){
  let m=0;
  for(const d of Object.keys(db)){
    if(d>=curDate) continue;
    for(const s of db[d]) if(s.ex===ex&&s.w>m) m=s.w;
  }
  return m;
}

/* ── 狀態 ── */
let curEx=null, curW=50, curR=10;

/* ── 動作選擇 ── */
function renderGrid(){
  const g=$('exGrid'); g.innerHTML='';
  for(const ex of [...DEFAULT_EX,...customEx]){
    const b=document.createElement('button');
    b.textContent=ex;
    if(ex===curEx) b.classList.add('sel');
    b.onclick=()=>selectEx(ex);
    g.appendChild(b);
  }
}
function selectEx(ex){
  curEx=ex;
  // 預填：當日做過→接續當日最後一組；否則→上次第一組
  const done=exSets(daySets(),ex);
  if(done.length){ curW=done[done.length-1].w; curR=done[done.length-1].r; }
  else{
    const last=lastSession(ex);
    if(last){ curW=last.sets[0].w; curR=last.sets[0].r; }
  }
  renderGrid(); renderControls(); renderLastBox();
}
$('customAdd').onclick=()=>{
  const v=$('customInput').value.trim();
  if(!v) return;
  if(![...DEFAULT_EX,...customEx].includes(v)){
    customEx.push(v);
    localStorage.setItem(CKEY,JSON.stringify(customEx));
  }
  $('customInput').value=''; $('customInput').blur();
  selectEx(v);
};
$('customInput').addEventListener('keydown',e=>{ if(e.key==='Enter') $('customAdd').onclick(); });

/* ── 數字輸入與加入 ── */
function renderControls(){
  if(document.activeElement!==$('wIn')) $('wIn').value=curW;
  if(document.activeElement!==$('rIn')) $('rIn').value=curR;
  $('addBtn').disabled=!curEx;
  $('addBtn').textContent=curEx?('加入這一組　'+curEx+' '+curW+'kg × '+curR):'先選一個動作';
}
function readNum(el,min,isInt){
  let v=parseFloat(String(el.value).replace(/[^0-9.]/g,''));
  if(!isFinite(v)) v=min;
  if(isInt) v=Math.round(v);
  return Math.max(min,v);
}
$('wIn').addEventListener('input',()=>{ curW=readNum($('wIn'),0,false); renderControls(); });
$('rIn').addEventListener('input',()=>{ curR=readNum($('rIn'),1,true); renderControls(); });
for(const id of ['wIn','rIn']){
  $(id).addEventListener('focus',e=>e.target.select());
  $(id).addEventListener('blur',()=>renderControls());
  $(id).addEventListener('keydown',e=>{ if(e.key==='Enter') e.target.blur(); });
}
$('addBtn').onclick=()=>{
  if(!curEx) return;
  if(!db[curDate]) db[curDate]=[];
  db[curDate].push({ex:curEx,w:curW,r:curR});
  persist();
  renderAll();
  toast('已記錄　'+curEx+' '+curW+'kg × '+curR);
};
$('undoBtn').onclick=()=>{
  const sets=db[curDate];
  if(!sets||!sets.length) return;
  const rm=sets.pop();
  if(!sets.length) delete db[curDate];
  persist(); renderAll();
  toast('已刪除　'+rm.ex+' '+rm.w+'kg × '+rm.r);
};
function delSet(i){
  const sets=db[curDate];
  if(!sets||!sets[i]) return;
  const rm=sets.splice(i,1)[0];
  if(!sets.length) delete db[curDate];
  persist(); renderAll();
  toast('已刪除　'+rm.ex+' '+rm.w+'kg × '+rm.r);
}
$('clearDay').onclick=()=>{
  if(!daySets().length){ toast('這一天沒有記錄'); return; }
  if(confirm('確定清除 '+curDate+' 的全部記錄？此動作無法復原。')){
    delete db[curDate]; persist(); renderAll(); toast('已清除');
  }
};

/* ── 日期選擇 ── */
$('dateIn').value=curDate;
$('dateIn').max=todayStr();
$('dateIn').addEventListener('change',()=>{
  curDate=$('dateIn').value||todayStr();
  if(curEx) selectEx(curEx);   // 依新日期重新預填
  renderAll();
});
function renderDateRow(){
  const isToday=curDate===todayStr();
  $('dateRow').classList.toggle('past',!isToday);
  $('dateLabel').textContent=isToday?'記錄日期（今天）':'補記過去日期';
}

/* ── 上次成績 ── */
function renderLastBox(){
  const box=$('lastBox');
  if(!curEx){ box.classList.remove('show'); return; }
  const last=lastSession(curEx);
  const tSets=exSets(daySets(),curEx);
  const tVol=vol(tSets);
  let html='';
  if(last){
    const lVol=vol(last.sets);
    html='上次 '+last.date.slice(5)+'　'+segTextKg(weightSegs(last.sets))
        +'　共 '+fmt(lVol)+' kg';
    if(tSets.length){
      html+='<br>本次已累積 '+fmt(tVol)+' kg';
      if(tVol>lVol) html+='　<span class="beat">✓ 已超越</span>';
    }
  }else{
    html='「'+curEx+'」第一次記錄，加油！';
    if(tSets.length) html+='<br>本次已累積 '+fmt(tVol)+' kg';
  }
  box.innerHTML=html;
  box.classList.add('show');
}

/* ── 當日清單（連續同動作同重量合併為一區塊，每組可刪） ── */
function renderToday(){
  const list=$('todayList'), sets=daySets();
  if(!sets.length){ list.innerHTML=''; return; }
  // 連續同動作＋同重量 → 一個區塊；idx 記錄每組在當日陣列中的位置
  const blocks=[];
  sets.forEach((s,i)=>{
    const last=blocks[blocks.length-1];
    if(last&&last.ex===s.ex&&last.w===s.w){ last.reps.push(s.r); last.idx.push(i); }
    else blocks.push({ex:s.ex,w:s.w,reps:[s.r],idx:[i]});
  });
  let html='<h3>'+(curDate===todayStr()?'今日已記錄':curDate+' 已記錄')+'</h3>';
  for(let i=blocks.length-1;i>=0;i--){ // 最新在上
    const b=blocks[i];
    const bVol=b.w*b.reps.reduce((a,c)=>a+c,0);
    const pr=histMaxW(b.ex)>0&&b.w>histMaxW(b.ex)?'<span class="prtag">PR</span>':'';
    html+='<div class="blk"><div class="hd"><span>'+b.ex+'　<span class="num">'+b.w+'kg</span>'+pr
        +'</span><span class="vol num">'+fmt(bVol)+' kg</span></div><div class="rows num">'
        +b.reps.map((r,j)=>'<div class="setrow"><span>第 '+(j+1)+' 組　<b>'+r
          +' 次</b></span><button class="del" data-i="'+b.idx[j]+'">✕</button></div>').join('')
        +'</div></div>';
  }
  list.innerHTML=html;
}
$('todayList').addEventListener('click',e=>{
  const btn=e.target.closest('.del');
  if(btn) delSet(+btn.dataset.i);
});

/* ── 底部統計 ── */
function renderFoot(){
  const sets=daySets();
  const exN=new Set(sets.map(s=>s.ex)).size;
  const label=curDate===todayStr()?'今日':curDate.slice(5);
  $('footStats').innerHTML=label+'<b>'+fmt(vol(sets))+'</b>kg';
  $('footSub').textContent=exN+' 動作 · '+sets.length+' 組';
}

/* service worker：離線快取（健身房沒訊號也開得起來）＋ 自動更新 */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const check=()=>{ if(!document.hidden) reg.update().catch(()=>{}); };
    check();
    document.addEventListener('visibilitychange',check);   // 每次回到 App 就檢查新版
  }).catch(()=>{});
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(reloading) return;                                   // 新版接手後自動重新載入
    reloading=true; location.reload();
  });
}

/* ── 匯出文字 ── */
function exportLines(date,sets){
  // 一動作一行（依首次出現順序），同動作依連續重量切段
  const order=[];
  for(const s of sets) if(!order.includes(s.ex)) order.push(s.ex);
  return order.map(ex=>{
    const es=exSets(sets,ex);
    return ex+'　'+segText(weightSegs(es))+'　（'+fmt(vol(es))+' kg）';
  });
}
function buildExport(){
  const sets=daySets();
  if(!sets.length) return curDate+' 訓練記錄\n\n（這一天沒有記錄）';
  return curDate+' 訓練記錄\n\n'+exportLines(curDate,sets).join('\n')
    +'\n\n總訓練量 '+fmt(vol(sets))+' kg';
}
$('copyBtn').onclick=async()=>{
  const txt=buildExport();
  try{ await navigator.clipboard.writeText(txt); toast('已複製'); }
  catch(e){
    const ta=document.createElement('textarea');
    ta.value=txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
    toast('已複製');
  }
};

/* ── 備份 ── */
const BKEY='trainlog-lastbackup';
const lastBackup=()=>{ const v=parseInt(localStorage.getItem(BKEY),10); return isFinite(v)?v:0; };
const daysSinceBackup=()=>{ const b=lastBackup(); return b?Math.floor((Date.now()-b)/864e5):null; };
function markBackup(){
  try{ localStorage.setItem(BKEY,Date.now()); }catch(e){}
  renderBackupInfo(); renderBanner();
}
function backupName(){ return '訓練記錄-backup-'+todayStr()+'.json'; }
function downloadBackup(){
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=backupName();
  a.click(); URL.revokeObjectURL(a.href);
  markBackup();
}
/* 主要備份路徑：叫出 iOS 分享選單，可一鍵存進「檔案」／iCloud 雲碟 */
$('backupBtn').onclick=async()=>{
  const json=JSON.stringify(db,null,1);
  try{
    const file=new File([json],backupName(),{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'訓練記錄備份'});
      markBackup(); toast('備份完成');
      return;
    }
  }catch(e){
    if(e&&e.name==='AbortError') return;    // 使用者自己取消，不要再跳下載
  }
  downloadBackup(); toast('已下載備份檔');
};
$('jsonExport').onclick=()=>{ downloadBackup(); toast('已下載備份檔'); };

function renderBackupInfo(){
  const d=daysSinceBackup();
  $('backupInfo').textContent = d===null ? '還沒備份過'
    : d===0 ? '上次備份：今天'
    : '上次備份：'+d+' 天前';
}
function renderBanner(){
  const el=$('backupWarn'), d=daysSinceBackup();
  const sessions=Object.keys(db).length;
  if(!sessions||(d!==null&&d<7)){ el.classList.remove('show'); return; }
  el.textContent = d===null
    ? '⚠️ 還沒備份過　刪除 App 或換手機記錄就會消失，點這裡備份'
    : '⚠️ 已 '+d+' 天沒備份　點這裡備份';
  el.classList.add('show');
}
$('backupWarn').onclick=()=>{
  document.querySelector('#tabs button[data-page="export"]').click();
};
$('jsonImport').addEventListener('change',e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const obj=JSON.parse(rd.result);
      if(typeof obj!=='object'||Array.isArray(obj)) throw 0;
      for(const k of Object.keys(obj))
        if(!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Array.isArray(obj[k])) throw 0;
      if(confirm('匯入將覆蓋現有全部記錄，確定？')){
        db=obj; persist(); renderAll(); toast('已匯入');
      }
    }catch(err){ toast('檔案格式不正確'); }
    e.target.value='';
  };
  rd.readAsText(f);
});

/* ── 歷史 ── */
function renderHistory(){
  const el=$('histList');
  const cutoff=new Date(Date.now()-30*864e5);
  const dates=Object.keys(db).sort().reverse()
    .filter(d=>new Date(d+'T00:00:00')>=cutoff);
  if(!dates.length){ el.innerHTML='<div class="empty">過去 30 天沒有記錄</div>'; return; }
  el.innerHTML=dates.map(d=>{
    const sets=db[d];
    const lines=exportLines(d,sets).map(l=>{
      const i=l.indexOf('　');
      return '<div class="ln num"><b>'+l.slice(0,i)+'</b>'+l.slice(i)+'</div>';
    }).join('');
    return '<div class="day"><div class="hd"><span class="d num">'+d
      +(d===todayStr()?'（今天）':'')+'</span><span class="v num">'
      +fmt(vol(sets))+' kg</span></div>'+lines+'</div>';
  }).join('');
}

/* ── 分頁切換 ── */
$('tabs').addEventListener('click',e=>{
  const p=e.target.dataset.page; if(!p) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
  document.querySelectorAll('main').forEach(m=>m.classList.toggle('on',m.id==='page-'+p));
  if(p==='export') $('exportText').textContent=buildExport();
  if(p==='history') renderHistory();
  window.scrollTo(0,0);
});

/* ── Toast ── */
let toastTm;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTm);
  toastTm=setTimeout(()=>t.classList.remove('show'),1600);
}

function renderAll(){
  renderDateRow(); renderGrid(); renderControls(); renderLastBox(); renderToday(); renderFoot();
  renderBanner(); renderBackupInfo();
  if($('page-export').classList.contains('on')) $('exportText').textContent=buildExport();
  if($('page-history').classList.contains('on')) renderHistory();
}
renderAll();
</script>
